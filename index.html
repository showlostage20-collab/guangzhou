<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>嗚啦啦廣州順德之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --ink:#1B1B1F;
    --paper:#FBF7EF;
    --paper2:#F1E9D6;
    --paper3:#EFE6CE;
    --red:#C4392A;
    --red-deep:#9E2A1F;
    --jade:#1F7A5C;
    --gold:#D89B2E;
    --blue:#2B4870;
    --line: rgba(27,27,31,0.12);
    --shadow: 0 6px 18px rgba(27,27,31,0.10);
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; overflow-x:hidden; width:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', -apple-system, sans-serif;
    padding-bottom:96px;
    background-image:
      radial-gradient(circle at 100% 0%, rgba(196,57,42,0.06), transparent 40%),
      radial-gradient(circle at 0% 20%, rgba(31,122,92,0.06), transparent 35%);
  }
  h1,h2,h3{font-family:'Noto Serif TC', serif; margin:0;}

  /* ===== Header ===== */
  .hero{
    padding:26px 20px 18px;
    border-bottom:3px solid var(--ink);
    background:
      repeating-linear-gradient(135deg, rgba(27,27,31,0.035) 0 2px, transparent 2px 14px),
      var(--paper);
    position:relative;
  }
  .hero .eyebrow{
    font-size:12px; letter-spacing:.22em; color:var(--red-deep); font-weight:700;
    display:flex; align-items:center; gap:8px; margin-bottom:6px;
  }
  .hero .eyebrow::before{content:"粵"; font-family:'Noto Serif TC',serif; background:var(--red); color:var(--paper);
    width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;}
  .hero h1{font-size:26px; font-weight:900; line-height:1.25; letter-spacing:.01em;}
  .hero h1 span{color:var(--red);}
  .hero p.sub{margin-top:6px; font-size:13px; color:#5b5b62;}
  .hero .base-card{
    margin-top:14px; background:var(--ink); color:var(--paper); border-radius:var(--radius);
    padding:12px 14px; font-size:12.5px; display:flex; gap:10px; align-items:flex-start;
    box-shadow: var(--shadow);
  }
  .hero .base-card b{color:var(--gold); font-family:'Noto Serif TC',serif; font-size:13px;}

  /* ===== Tabs (stamp style) ===== */
  .tabbar{
    position:sticky; top:0; z-index:50;
    display:flex; gap:8px; overflow-x:auto; padding:12px 14px;
    background:rgba(251,247,239,0.94); backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    -ms-overflow-style: none; scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; cursor:pointer; user-select:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:58px; height:58px; border-radius:10px;
    border:2px solid var(--ink); background:var(--paper);
    transform:rotate(-2deg);
    transition: transform .15s ease, background .15s ease, color .15s ease;
  }
  .tab:nth-child(even){transform:rotate(2deg);}
  .tab .num{font-family:'Noto Serif TC',serif; font-weight:900; font-size:17px; line-height:1;}
  .tab .cn{font-size:9.5px; letter-spacing:.05em; margin-top:2px;}
  .tab.active{
    background:var(--red); border-color:var(--red-deep); color:var(--paper);
    transform:rotate(0deg) scale(1.05);
    box-shadow: var(--shadow);
  }
  .tab.pack{border-style:dashed;}
  .tab.pack.active{background:var(--jade); border-color:#134f3b;}

  /* ===== Panels ===== */
  .panel{display:none; padding:16px 14px 8px;}
  .panel.active{display:block; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .day-title{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px;}
  .day-title h2{font-size:20px; font-weight:900;}
  .day-title .day-note{font-size:12.5px; color:#6b6b72; margin-top:2px;}

  /* Summary card */
  .summary{
    margin-top:12px; border-radius:var(--radius); background:var(--paper2);
    border:1.5px solid var(--ink); padding:12px 14px; display:flex; gap:14px;
    box-shadow: var(--shadow);
  }
  .summary .item{flex:1; text-align:center;}
  .summary .item .label{font-size:11px; color:#6b6b72; letter-spacing:.04em;}
  .summary .item .value{font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; margin-top:2px;}
  .summary .item.time .value{color:var(--blue);}
  .summary .item.cost .value{color:var(--red-deep);}
  .summary .divider{width:1px; background:var(--line);}
  .summary .hint{width:100%; font-size:10.5px; color:#8b8b90; text-align:center; margin-top:6px;}

  /* Flight cards */
  .flight-card{
    border:1.5px solid var(--ink); border-radius:var(--radius); background:#fff;
    padding:14px; margin-bottom:14px; box-shadow: var(--shadow); position:relative; overflow:visible;
    width:100%; box-sizing:border-box; max-width:100%;
  }
  .flight-card::before{
    content:""; position:absolute; left:-2px; top:0; bottom:0; width:5px;
  }
  .flight-card.outbound::before{background:var(--jade);}
  .flight-card.inbound::before{background:var(--red);}
  .flight-card .flight-head{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .flight-card .flight-head .plane{font-size:18px;}
  .flight-card .flight-head h3{font-size:15px; font-weight:900;}
  .flight-card .flight-head .badge{
    margin-left:auto; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;
  }
  .flight-card.outbound .badge{background:rgba(31,122,92,0.12); color:var(--jade);}
  .flight-card.inbound .badge{background:rgba(196,57,42,0.10); color:var(--red-deep);}
  .flight-route,.leg-route{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .flight-route input.city,.leg-route input.city{
    flex:1; min-width:0; width:100%; box-sizing:border-box;
    border:1.5px solid var(--line); border-radius:8px; padding:8px 6px; font-family:inherit;
    font-size:12.5px; font-weight:700; text-align:center; color:var(--ink);
  }
  .flight-route .arrow,.leg-route .arrow{color:#9a9a9f; font-size:16px; flex:0 0 auto;}
  .leg{border:1.5px dashed var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:var(--paper);}
  .leg:last-child{margin-bottom:0;}
  .transfer-note{
    display:flex; align-items:center; gap:8px; margin:0 0 8px; font-size:11.5px; color:#8a611b;
    background:#FFF7E8; border:1px solid var(--gold); border-radius:8px; padding:7px 10px;
  }
  .transfer-note input{
    flex:1; min-width:0; border:none; background:transparent; font-size:11.5px; color:#8a611b;
    font-family:inherit; padding:0;
  }
  .transfer-note input:focus{outline:none;}
  .flight-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; width:100%;}
  .flight-grid .field{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .flight-grid .field.full{grid-column:1 / -1;}
  .flight-grid label{font-size:10.5px; color:#8b8b90; letter-spacing:.04em; font-weight:700;}
  .flight-grid input{
    width:100%; min-width:0; box-sizing:border-box;
    border:1.5px solid var(--line); border-radius:8px; padding:9px 8px; font-family:inherit;
    font-size:13px; color:var(--ink); background:var(--paper);
  }
  .flight-grid input:focus{outline:none; border-color:var(--gold);}
  .flight-grid input::placeholder{color:#b6b6ba; font-size:11.5px;}
  @media (max-width:360px){
    .flight-grid{grid-template-columns:1fr;}
    .flight-grid .field{grid-column:1 / -1;}
  }

  /* Timeline */
  .timeline{margin-top:16px; position:relative; padding-left:2px;}
  .transport-row{
    display:flex; align-items:center; gap:8px; margin:10px 0 10px 6px; font-size:12px; color:#555;
  }
  .transport-row .icon{
    width:24px;height:24px;border-radius:50%; background:var(--blue); color:#fff; display:flex;
    align-items:center; justify-content:center; font-size:13px; flex:0 0 auto;
  }
  .transport-row.taxi .icon{background:var(--gold); color:var(--ink);}
  .transport-row.walk .icon{background:#8a8a90;}
  .transport-row .desc{flex:1; line-height:1.4;}
  .transport-row .stat{display:flex; gap:4px; align-items:center; flex:0 0 auto;}
  .transport-row input{
    width:40px; border:none; border-bottom:1.5px dashed var(--line); background:transparent;
    font-size:12px; text-align:right; color:var(--ink); font-weight:700; font-family:inherit;
  }
  .transport-row input:focus{outline:none; border-color:var(--red);}
  .transport-row .unit{font-size:10.5px; color:#8b8b90;}

  .stop{
    border:1.5px solid var(--ink); border-radius:var(--radius); background:#fff;
    padding:12px 14px; margin-bottom:6px; box-shadow: var(--shadow); position:relative;
  }
  .stop::before{
    content:""; position:absolute; left:-2px; top:14px; bottom:14px; width:4px; border-radius:4px;
  }
  .stop.type-spot::before{background:var(--jade);}
  .stop.type-food::before{background:var(--red);}
  .stop.type-shop::before{background:var(--gold);}
  .stop-head{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .stop-time{
    font-family:'Noto Serif TC',serif; font-weight:900; font-size:14px; color:var(--paper);
    background:var(--ink); border-radius:6px; padding:3px 7px; flex:0 0 auto;
  }
  .stop-tag{font-size:10px; letter-spacing:.04em; padding:2px 7px; border-radius:20px; flex:0 0 auto; font-weight:700;}
  .type-spot .stop-tag{background:rgba(31,122,92,0.12); color:var(--jade);}
  .type-food .stop-tag{background:rgba(196,57,42,0.10); color:var(--red-deep);}
  .type-shop .stop-tag{background:rgba(216,155,46,0.16); color:#8a611b;}
  .stop-title{font-weight:700; font-size:15px; flex:1; line-height:1.3;}
  .stop-arrow{font-size:12px; color:#9a9a9f; transition:transform .2s ease; flex:0 0 auto;}
  .stop.open .stop-arrow{transform:rotate(90deg);}
  .stop-body{display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:13px; line-height:1.6; color:#3a3a3f;}
  .stop.open .stop-body{display:block;}
  .stop-body .note-label{font-size:10.5px; color:var(--jade); font-weight:700; letter-spacing:.04em; margin-bottom:3px;}
  .contact-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .contact-row a{
    font-size:12px; text-decoration:none; color:var(--blue); background:var(--paper2);
    padding:5px 10px; border-radius:20px; border:1px solid var(--line); display:inline-flex; gap:5px; align-items:center;
  }
  .contact-row a.tel{color:var(--red-deep);}
  .contact-row a.gaode{color:var(--jade); border-color:rgba(31,122,92,0.35); background:rgba(31,122,92,0.08);}

  [contenteditable="true"]{outline:none; border-bottom:1.5px dashed var(--gold); background:rgba(216,155,46,0.06); border-radius:3px; padding:0 2px;}

  .del-stop{
    display:none; margin-top:10px; font-size:11.5px; color:var(--red-deep); background:none; border:1px solid var(--red-deep);
    border-radius:20px; padding:4px 10px; font-family:inherit; cursor:pointer;
  }
  body.editing .del-stop{display:inline-block;}
  body.editing .stop{border-color:var(--red-deep);}

  .add-stop-btn{
    width:100%; margin-top:8px; padding:12px; border-radius:var(--radius); border:2px dashed var(--ink);
    background:transparent; color:var(--ink); font-weight:700; font-size:13px; font-family:inherit; cursor:pointer;
    display:none;
  }
  body.editing .add-stop-btn{display:block;}

  .callout{
    margin:14px 0; background:#FFF7E8; border:1.5px solid var(--gold); border-radius:var(--radius);
    padding:12px 14px; font-size:12.5px; line-height:1.6; color:#5c4413;
  }
  .callout b{color:var(--red-deep);}

  /* Packing list */
  .pack-cat{margin-bottom:18px;}
  .pack-cat h3{font-size:15px; color:var(--jade); border-bottom:2px solid var(--jade); display:inline-block; padding-bottom:2px; margin-bottom:8px;}
  .pack-item{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line);}
  .pack-item input[type=checkbox]{width:19px; height:19px; accent-color:var(--jade); flex:0 0 auto;}
  .pack-item span{flex:1; font-size:14px;}
  .pack-item.checked span{text-decoration:line-through; color:#a8a8ac;}
  .add-item-row{display:flex; gap:8px; margin-top:8px;}
  .add-item-row input{flex:1; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:13px;}
  .add-item-row button{border:none; background:var(--jade); color:#fff; border-radius:8px; padding:0 14px; font-weight:700; font-family:inherit;}

  /* Split / expense tracker */
  .split-section{margin-bottom:20px;}
  .split-section h3{font-size:15px; color:var(--red-deep); border-bottom:2px solid var(--red-deep); display:inline-block; padding-bottom:2px; margin-bottom:10px;}
  .member-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .member-chip{
    display:flex; align-items:center; gap:6px; background:var(--paper2); border:1.5px solid var(--ink);
    border-radius:20px; padding:6px 8px 6px 12px; font-size:13px; font-weight:700;
  }
  .member-chip button{
    border:none; background:var(--red); color:#fff; width:18px; height:18px; border-radius:50%;
    font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .add-row{display:flex; gap:8px;}
  .add-row input{flex:1; min-width:0; border:1.5px solid var(--line); border-radius:8px; padding:9px 10px; font-family:inherit; font-size:13px; box-sizing:border-box;}
  .add-row button{border:none; background:var(--ink); color:#fff; border-radius:8px; padding:0 14px; font-weight:700; font-family:inherit; flex:0 0 auto;}

  .expense-form{border:1.5px solid var(--ink); border-radius:var(--radius); padding:14px; background:#fff; box-shadow:var(--shadow); margin-bottom:16px;}
  .expense-form .row{margin-bottom:10px;}
  .expense-form label{font-size:10.5px; color:#8b8b90; font-weight:700; letter-spacing:.03em; display:block; margin-bottom:4px;}
  .expense-form input[type=text], .expense-form input[type=number], .expense-form select{
    width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:8px; padding:9px 10px;
    font-family:inherit; font-size:13.5px; background:var(--paper); color:var(--ink);
  }
  .split-checks{display:flex; flex-wrap:wrap; gap:8px;}
  .split-check{display:flex; align-items:center; gap:5px; background:var(--paper2); border:1px solid var(--line); border-radius:20px; padding:5px 10px; font-size:12.5px;}
  .split-check input{width:15px; height:15px; accent-color:var(--jade);}
  .split-quick{font-size:11px; color:var(--blue); text-decoration:underline; margin-left:auto; cursor:pointer; background:none; border:none; font-family:inherit;}
  .expense-form .submit-btn{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--red); color:#fff;
    font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; margin-top:4px;
  }

  .expense-item{border:1.5px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; background:#fff; position:relative;}
  .expense-item.editing{border-color:var(--gold); background:#FFFDF7;}
  .expense-item .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .expense-item .desc{font-weight:700; font-size:14px; padding-right:44px;}
  .expense-item .amount{font-family:'Noto Serif TC',serif; font-weight:900; font-size:16px; color:var(--red-deep); flex:0 0 auto;}
  .expense-item .meta{font-size:11.5px; color:#8b8b90; margin-top:5px; line-height:1.6;}
  .expense-item .item-actions{position:absolute; top:8px; right:8px; display:flex; gap:2px;}
  .expense-item .item-actions button{
    border:none; background:none; color:#b6b6ba; font-size:14px;
    cursor:pointer; line-height:1; padding:4px 6px; border-radius:6px;
  }
  .expense-item .item-actions .edit-exp:hover{background:rgba(216,155,46,0.15); color:#8a611b;}
  .expense-item .item-actions .del-exp:hover{background:rgba(196,57,42,0.12); color:var(--red-deep);}
  .empty-hint{font-size:12.5px; color:#9a9a9f; text-align:center; padding:14px 0;}

  .summary-card{border:1.5px solid var(--ink); border-radius:var(--radius); background:var(--paper2); padding:14px; box-shadow:var(--shadow); margin-bottom:16px;}
  .summary-card .total-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed var(--line);}
  .summary-card .total-row .label{font-size:12.5px; color:#6b6b72;}
  .summary-card .total-row .value{font-family:'Noto Serif TC',serif; font-weight:900; font-size:22px; color:var(--red-deep);}
  .balance-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px;}
  .balance-row .name{font-weight:700;}
  .balance-row .amt.positive{color:var(--jade); font-weight:700;}
  .balance-row .amt.negative{color:var(--red-deep); font-weight:700;}
  .balance-row .amt.zero{color:#9a9a9f;}
  .settle-item{
    display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--gold);
    border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:13px;
  }
  .settle-item .ic{font-size:15px;}
  .settle-item b{color:var(--red-deep);}
  .settle-item b.to{color:var(--jade);}
  .deposit-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0; gap:10px;}
  .deposit-row .name{font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:4px;}
  .head-badge{font-size:10.5px; font-weight:700; color:var(--jade); background:rgba(31,122,92,0.1); border-radius:20px; padding:2px 7px;}
  .deposit-inputs{display:flex; align-items:center; gap:6px;}
  .deposit-inputs input{
    box-sizing:border-box; border:1.5px solid var(--line); border-radius:8px; padding:7px 8px;
    font-family:inherit; font-size:13px; text-align:right; background:#fff;
  }
  .deposit-inputs .head-input{width:52px;}
  .deposit-inputs .deposit-input{width:90px;}
  .sync-badge{
    display:inline-block; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;
    margin:8px 0 4px;
  }
  .sync-badge.sync-ok{background:rgba(31,122,92,0.12); color:var(--jade);}
  .sync-badge.sync-mid{background:rgba(216,155,46,0.16); color:#8a611b;}
  .sync-badge.sync-off{background:rgba(196,57,42,0.10); color:var(--red-deep);}
  .cat-tag{
    display:inline-block; font-size:10.5px; font-weight:700; background:var(--paper2); color:var(--ink);
    border-radius:20px; padding:2px 8px; margin-right:6px; border:1px solid var(--line);
  }

  /* Edit FAB */
  .fab{
    position:fixed; right:16px; bottom:20px; z-index:60;
    width:56px; height:56px; border-radius:50%; background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center; font-size:22px; border:none;
    box-shadow:0 8px 20px rgba(27,27,31,0.35); cursor:pointer;
  }
  .fab.on{background:var(--red);}
  .edit-banner{
    display:none; position:sticky; top:82px; z-index:40; margin:0 14px; padding:8px 12px; border-radius:10px;
    background:var(--red); color:#fff; font-size:12px; text-align:center; font-weight:700;
  }
  body.editing .edit-banner{display:block;}

  footer{text-align:center; font-size:11px; color:#9a9a9f; padding:30px 20px 10px;}
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">5 DAYS · 广州 · 佛山 · 顺德</div>
  <h1>嗚啦啦<span>廣州順德</span>之旅</h1>
  <p class="sub">2026.09.24 – 09.28　老城騎樓 × 批發淘貨 × 佛山順德 × 小蠻腰快閃 — 全程以打車／地鐵移動</p>
  <div class="base-card">
    <span>🏨</span>
    <div><b>住宿基地：</b>北京路步行街／吾悅廣場民宿，4晚皆以此為出發與回程點。</div>
  </div>

function renderFlightCard(key, label, cls){
  const f = flightData[key];
  const legsHtml = f.legs.map((leg, i)=>{
    const legBlock = `
      <div class="leg">
        <div class="leg-route">
          <input class="city" data-flight="${key}" data-leg="${i}" data-legfield="from" value="${leg.from}">
          <span class="arrow">→</span>
          <input class="city" data-flight="${key}" data-leg="${i}" data-legfield="to" value="${leg.to}">
        </div>
        <div class="flight-grid">
          <div class="field">
            <label>出發時間</label>
            <input type="time" data-flight="${key}" data-leg="${i}" data-legfield="depTime" value="${leg.depTime}">
          </div>
          <div class="field">
            <label>抵達時間</label>
            <input type="time" data-flight="${key}" data-leg="${i}" data-legfield="arrTime" value="${leg.arrTime}">
          </div>
          <div class="field full">
            <label>航空公司／航班號</label>
            <input type="text" data-flight="${key}" data-leg="${i}" data-legfield="flight" placeholder="尚未確定，訂票後再填入" value="${leg.flight}">
          </div>
        </div>
      </div>`;
    const transferBlock = (i < f.legs.length-1) ? `
      <div class="transfer-note">
        <span>✈️→✈️</span>
        <input type="text" data-flight="${key}" data-transfer="${i}" value="${f.transfers[i]||''}">
      </div>` : '';
    return legBlock + transferBlock;
  }).join('');

  return `
    <div class="flight-card ${cls}">
      <div class="flight-head">
        <span class="plane">✈️</span>
        <h3>${label}</h3>
        <span class="badge">${cls==='outbound'?'出發':'返程'}</span>
      </div>
      <div class="flight-grid" style="margin-bottom:12px;">
        <div class="field full">
          <label>日期</label>
          <input type="date" data-flight="${key}" data-field="date" value="${f.date}">
        </div>
      </div>
      ${legsHtml}
    </div>
  `;
}

function bindFlightInputs(){
  document.querySelectorAll('[data-flight]').forEach(input=>{
    input.addEventListener('input', ()=>{
      const key = input.dataset.flight;
      if(input.dataset.field){
        flightData[key][input.dataset.field] = input.value;
      } else if(input.dataset.leg !== undefined){
        flightData[key].legs[Number(input.dataset.leg)][input.dataset.legfield] = input.value;
      } else if(input.dataset.transfer !== undefined){
        flightData[key].transfers[Number(input.dataset.transfer)] = input.value;
      }
    });
  });
}

function renderStop(day, stop, idx){
  const wrap = document.createElement('div');

  const meta = transportMeta[stop.transport.mode];
  const tRow = document.createElement('div');
  tRow.className = 'transport-row '+meta.cls;
  tRow.innerHTML = `
    <div class="icon">${meta.icon}</div>
    <div class="desc">${meta.label}${stop.transport.from? '　'+stop.transport.from+' → '+stop.title : ''}</div>
    <div class="stat">
      <input type="number" min="0" value="${stop.transport.min}" data-role="min"><span class="unit">分</span>
      <input type="number" min="0" value="${stop.transport.cost}" data-role="cost"><span class="unit">¥</span>
    </div>
  `;
  const minInput = tRow.querySelector('[data-role="min"]');
  const costInput = tRow.querySelector('[data-role="cost"]');
  minInput.oninput=()=>{ stop.transport.min = Number(minInput.value)||0; updateSummary(day.id); };
  costInput.oninput=()=>{ stop.transport.cost = Number(costInput.value)||0; updateSummary(day.id); };
  wrap.appendChild(tRow);

  const card = document.createElement('div');
  card.className = 'stop type-'+stop.type;
  card.innerHTML = `
    <div class="stop-head">
      <div class="stop-time">${stop.time}</div>
      <div class="stop-tag">${stop.tag}</div>
      <div class="stop-title" contenteditable="false" data-field="title">${stop.title}</div>
      <div class="stop-arrow">▶</div>
    </div>
    <div class="stop-body">
      <div class="note-label">簡介／備註</div>
      <div contenteditable="false" data-field="note">${stop.note||''}</div>
      <div class="contact-row">
        <a class="gaode" target="_blank" href="https://uri.amap.com/search?keyword=${encodeURIComponent(stop.address||stop.title)}">🗺️ 高德地圖</a>
        ${stop.address?`<a class="addr" target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(stop.address)}">📍 ${stop.address}</a>`:''}
        ${stop.phone && stop.phone!=='-'?`<a class="tel" href="tel:${stop.phone}">📞 ${stop.phone}</a>`:''}
      </div>
      <button class="del-stop">刪除此行程</button>
    </div>
  `;
  const head = card.querySelector('.stop-head');
  head.onclick=(e)=>{
    if(document.body.classList.contains('editing') && e.target.closest('[contenteditable]')) return;
    card.classList.toggle('open');
  };
  card.querySelector('.stop-title').addEventListener('blur', ()=>{ stop.title = card.querySelector('.stop-title').innerText; });
  card.querySelector('[data-field="note"]').addEventListener('blur', ()=>{ stop.note = card.querySelector('[data-field="note"]').innerText; });
  card.querySelector('.del-stop').onclick=(e)=>{
    e.stopPropagation();
    if(!confirm('確定要刪除這個行程嗎？')) return;
    const i = day.stops.indexOf(stop);
    if(i>-1) day.stops.splice(i,1);
    wrap.remove();
    updateSummary(day.id);
  };
  wrap.appendChild(card);
  return wrap;
}

function updateSummary(dayId){
  const day = tripData.days.find(d=>d.id===dayId);
  if(!day) return;
  const totalMin = day.stops.reduce((s,st)=>s+(Number(st.transport.min)||0),0);
  const totalCost = day.stops.reduce((s,st)=>s+(Number(st.transport.cost)||0),0);
  const box = document.querySelector(`.summary[data-summary="${dayId}"]`);
  if(!box) return;
  const h = Math.floor(totalMin/60), m = totalMin%60;
  box.querySelector('[data-sum-time]').textContent = h>0? `${h} 時 ${m} 分` : `${m} 分`;
  box.querySelector('[data-sum-cost]').textContent = `¥${totalCost}`;
}

}

let splitRef = null;

function initFirebaseSync(){
  try{
    if(typeof firebase === 'undefined'){
      console.warn('Firebase SDK 未載入，分帳資料僅會保存在本機瀏覽器');
      updateSyncBadge('offline');
      return;
    }
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    splitRef = db.ref('splitData');

    // 若 5 秒內都沒有連線回應（例如網路被擋、file:// 開啟受限），顯示離線狀態
    const connectTimeout = setTimeout(()=>{
      if(!firebaseReady) updateSyncBadge('offline');
    }, 5000);

    splitRef.on('value', (snap)=>{
      clearTimeout(connectTimeout);
      const val = snap.val();
      if(val){
        splitData = val;
        if(!splitData.deposits) splitData.deposits = {};
        if(!splitData.headcount) splitData.headcount = {};
        if(!splitData.expenses) splitData.expenses = [];
        if(!splitData.members) splitData.members = [];
      } else {
        // 資料庫是空的，把預設資料寫進去，當作大家的起始狀態
        splitData = JSON.parse(JSON.stringify(defaultSplitData));
        splitRef.set(splitData);
      }
      firebaseReady = true;
      refreshSplitPanel();
      updateSyncBadge('synced');
    }, (err)=>{
      clearTimeout(connectTimeout);
      console.warn('Firebase 讀取失敗', err);
      updateSyncBadge('offline');
    });
  }catch(e){
    console.warn('Firebase 初始化失敗，分帳資料僅會保存在本機瀏覽器', e);
    updateSyncBadge('offline');
  }
}

function pushSplitData(){
  if(splitRef){
    updateSyncBadge('syncing');
    splitRef.set(splitData).then(()=> updateSyncBadge('synced')).catch(()=> updateSyncBadge('offline'));
  }
}

function updateSyncBadge(state){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  const map = {
    synced: {text:'☁️ 已同步（大家都看得到）', cls:'sync-ok'},
    syncing: {text:'☁️ 同步中…', cls:'sync-mid'},
    offline: {text:'⚠️ 離線，僅存本機', cls:'sync-off'}
  };
  const m = map[state] || map.offline;
  el.textContent = m.text;
  el.className = 'sync-badge ' + m.cls;
}

function fmtMoney(n){
  const sign = n<0? '-' : '';
  return sign + '¥' + Math.abs(Math.round(n));
}

function headOf(m){ return Number(splitData.headcount[m])||1; }

function computeExpenseShares(exp){
  const among = exp.splitAmong.filter(m=> splitData.members.includes(m));
  const shares = {};
  const totalHeads = among.reduce((s,m)=> s+headOf(m), 0);
  if(totalHeads<=0) return shares;
  const perHead = exp.amount / totalHeads;
  among.forEach(m=>{ shares[m] = perHead * headOf(m); });
  return shares;
}

function computeBalances(){
  const balance = {};
  splitData.members.forEach(m=> balance[m] = Number(splitData.deposits[m])||0);
  splitData.expenses.forEach(exp=>{
    const shares = computeExpenseShares(exp);
    if(exp.paidBy!==POOL_KEY && balance[exp.paidBy]!==undefined) balance[exp.paidBy] += exp.amount;
    Object.keys(shares).forEach(m=>{ balance[m] -= shares[m]; });
  });
  return balance;
}

function computeCategoryTotals(){
  const totals = {};
  expenseCategories.forEach(c=> totals[c.key]=0);
  splitData.expenses.forEach(exp=>{ totals[exp.category] = (totals[exp.category]||0) + exp.amount; });
  return totals;
}

function computeSettlements(balance){
  const creditors=[], debtors=[];
  Object.keys(balance).forEach(m=>{
    const v = Math.round(balance[m]*100)/100;
    if(v>0.5) creditors.push({m, v});
    else if(v<-0.5) debtors.push({m, v:-v});
  });
  creditors.sort((a,b)=>b.v-a.v);
  debtors.sort((a,b)=>b.v-a.v);
  const settlements=[];
  let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const pay = Math.min(debtors[i].v, creditors[j].v);
    settlements.push({from:debtors[i].m, to:creditors[j].m, amount:pay});
    debtors[i].v -= pay; creditors[j].v -= pay;
    if(debtors[i].v<0.5) i++;
    if(creditors[j].v<0.5) j++;
  }
  return settlements;
}

  ).join('');

        if(editingExpenseId===exp.id){

              <div class="row">
                <label>類別</label>

              </div>

        const dateLabel = exp.date ? exp.date.slice(5).replace('-','/') + '　' : '';
        const shares = computeExpenseShares(exp);

      }).join('');

  const balanceRows = splitData.members.map(m=>{

    const label = v>0.5? '多退' : (v<-0.5? '少補':'剛好結清');

  }).join('');

  const settleHtml = settlements.length===0
    ? `<div class="empty-hint">目前帳務已平衡，不需要互相轉帳 🎉</div>`
    : settlements.map(s=>`
        <div class="settle-item"><span class="ic">💸</span><b>${s.from}</b> 應付給 <b class="to">${s.to}</b>　<span style="margin-left:auto; font-weight:900;">${fmtMoney(s.amount)}</span></div>

    <div id="syncBadge" class="sync-badge sync-mid">☁️ 連線中…</div>

    <div class="split-section">
      <h3>成員</h3>
      <div class="member-chips">${memberChips}</div>
      <div class="add-row">

      <h3>各家人數與訂金</h3>
      <div class="day-note" style="margin:-4px 0 10px;">公帳花費會依各家人數比例分攤，例如 ¥80 由 4 人的林家與各 2 人的吳家、伍家分攤，林家 ¥40、吳家 ¥20、伍家 ¥20</div>
      <div class="summary-card">
        ${depositRows}
        <div class="total-row" style="margin-top:8px; border-top:1px dashed var(--line); border-bottom:none; padding-top:10px; padding-bottom:0;">
          <span class="label">總人數 ${totalHeadsAll} 人　·　訂金總額</span><span class="value" style="font-size:18px;">${fmtMoney(totalDeposit)}</span>
        </div>
      </div>
    </div>

    <div class="split-section">
      <h3>新增花費</h3>
      <div class="expense-form">
        <div class="row">
          <label>類別</label>
          <select id="expCategory">${categoryOptions}</select>
        </div>
        <div class="row">
          <label>日期</label>
          <input type="date" id="expDate" min="2026-09-24" max="2026-09-28" value="${splitData.lastDate||'2026-09-24'}">
        </div>
        <div class="row">
          <label>項目名稱</label>
          <input type="text" id="expDesc" placeholder="例如：晚餐 / 打車 / 門票">
        </div>
        <div class="row">
          <label>金額（¥）</label>
          <input type="number" id="expAmount" min="0" placeholder="0">
        </div>
        <div class="row">
          <label>錢是誰付的</label>
          <select id="expPaidBy">${payerOptions}</select>
        </div>
        <div class="row">
          <label style="display:flex; align-items:center;">由誰分攤　<button type="button" class="split-quick" id="selectAllBtn">全選</button></label>
          <div class="split-checks" id="splitChecksBox">${splitChecks}</div>
        </div>
        <button class="submit-btn" id="addExpenseBtn">＋ 加入這筆花費</button>
      </div>
    </div>

    <div class="split-section">
      <h3>花費紀錄</h3>
      ${expenseListHtml}
    </div>

    <div class="split-section">
      <h3>依類別統計</h3>
      <div class="summary-card">
        ${catStatsHtml}
      </div>
    </div>

    <div class="split-section">
      <h3>結算總覽（多退少補）</h3>
      <div class="summary-card">
        <div class="total-row"><span class="label">目前總花費</span><span class="value">${fmtMoney(totalAmount)}</span></div>
        ${balanceRows}
      </div>
      <h3 style="margin-top:6px;">建議轉帳</h3>
      ${settleHtml}
      <button class="submit-btn" id="exportExcelBtn" style="margin-top:14px; background:var(--jade);">📤 匯出成 Excel</button>
    </div>
  `;

  // 事件綁定
  panel.querySelectorAll('[data-remove-member]').forEach(btn=>{
    btn.onclick=()=>{
      const name = btn.dataset.removeMember;
      if(splitData.members.length<=1){ alert('至少要保留一位成員喔'); return; }
      const involved = splitData.expenses.some(e=> e.paidBy===name || e.splitAmong.includes(name));
      if(involved && !confirm(`「${name}」已有相關花費紀錄，移除成員將一併從紀錄中移除，確定嗎？`)) return;
      splitData.members = splitData.members.filter(m=>m!==name);
      delete splitData.deposits[name];
      delete splitData.headcount[name];
      splitData.expenses.forEach(e=>{ e.splitAmong = e.splitAmong.filter(m=>m!==name); });
      splitData.expenses = splitData.expenses.filter(e=> e.paidBy!==name);
      pushSplitData();
      refreshSplitPanel();
    };
  });

  panel.querySelector('#addMemberBtn').onclick=()=>{
    const input = panel.querySelector('#newMemberInput');
    const name = input.value.trim();
    if(name==='') return;
    if(splitData.members.includes(name)){ alert('這個名字已經存在囉'); return; }
    splitData.members.push(name);
    splitData.deposits[name] = 0;
    splitData.headcount[name] = 1;
    pushSplitData();
    refreshSplitPanel();
  };
  panel.querySelector('#newMemberInput').addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); panel.querySelector('#addMemberBtn').click(); }
  });

  panel.querySelectorAll('[data-deposit-member]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      splitData.deposits[inp.dataset.depositMember] = Number(inp.value)||0;
      pushSplitData();
      refreshSplitPanel();
    });
  });

  panel.querySelectorAll('[data-head-member]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      splitData.headcount[inp.dataset.headMember] = Math.max(1, Number(inp.value)||1);
      pushSplitData();
      refreshSplitPanel();
    });

  panel.querySelector('#selectAllBtn').onclick=()=>{
    panel.querySelectorAll('#splitChecksBox input[type=checkbox]').forEach(cb=> cb.checked=true);
  };

  panel.querySelector('#addExpenseBtn').onclick=()=>{
    const category = panel.querySelector('#expCategory').value;
    const date = panel.querySelector('#expDate').value || splitData.lastDate;
    const desc = panel.querySelector('#expDesc').value.trim();

    const paidBy = panel.querySelector('#expPaidBy').value;
    const among = Array.from(panel.querySelectorAll('#splitChecksBox input[type=checkbox]:checked')).map(cb=>cb.value);
    if(desc===''){ alert('請輸入項目名稱'); return; }
    if(!amount || amount<=0){ alert('請輸入正確的金額'); return; }
    if(among.length===0){ alert('請至少選擇一位分攤的人'); return; }
    splitData.expenses.push({id:newExpenseId(), desc, amount, date, category, paidBy, splitAmong:among});
    splitData.lastDate = date;
    pushSplitData();
    refreshSplitPanel();
  };

  panel.querySelectorAll('[data-del-exp]').forEach(btn=>{
    btn.onclick=()=>{
      const id = btn.dataset.delExp;
      if(!confirm('確定要刪除這筆花費嗎？')) return;
      splitData.expenses = splitData.expenses.filter(e=>String(e.id)!==String(id));
      if(editingExpenseId===id) editingExpenseId=null;
      pushSplitData();
      refreshSplitPanel();
    };
  });

  panel.querySelectorAll('[data-edit-exp]').forEach(btn=>{
    btn.onclick=()=>{
      editingExpenseId = btn.dataset.editExp;
      refreshSplitPanel();
    };
  });

  panel.querySelectorAll('[data-cancel-edit]').forEach(btn=>{
    btn.onclick=()=>{
      editingExpenseId = null;
      refreshSplitPanel();
    };
  });

  panel.querySelectorAll('[data-save-edit]').forEach(btn=>{
    btn.onclick=()=>{
      const id = btn.dataset.saveEdit;
      const exp = splitData.expenses.find(e=> String(e.id)===String(id));
      if(!exp) return;
      const wrap = btn.closest('.expense-item');
      const category = wrap.querySelector('[data-edit-field="category"]').value;
      const date = wrap.querySelector('[data-edit-field="date"]').value;
      const desc = wrap.querySelector('[data-edit-field="desc"]').value.trim();
      const amount = Number(wrap.querySelector('[data-edit-field="amount"]').value);
      const paidBy = wrap.querySelector('[data-edit-field="paidBy"]').value;
      const among = Array.from(wrap.querySelectorAll('[data-edit-splitbox] input[type=checkbox]:checked')).map(cb=>cb.value);
      if(desc===''){ alert('請輸入項目名稱'); return; }
      if(!amount || amount<=0){ alert('請輸入正確的金額'); return; }
      if(among.length===0){ alert('請至少選擇一位分攤的人'); return; }
      exp.category = category; exp.date = date; exp.desc = desc; exp.amount = amount;
      exp.paidBy = paidBy; exp.splitAmong = among;
      editingExpenseId = null;
      pushSplitData();
      refreshSplitPanel();
    };
  });

  panel.querySelector('#exportExcelBtn').onclick = exportSplitToExcel;
}

function exportSplitToExcel(){
  if(typeof XLSX === 'undefined'){
    alert('目前沒有網路連線，暫時無法匯出 Excel，請連上網路後再試一次。');
    return;
  }
  const hasDeposit = splitData.members.some(m=> (Number(splitData.deposits[m])||0) > 0);
  if(splitData.expenses.length===0 && !hasDeposit){
    alert('目前還沒有任何訂金或花費紀錄，先輸入一些資料再匯出喔！');
    return;
  }

  const expenseRows = splitData.expenses.slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id-b.id).map(e=>{
    const c = catInfo(e.category);
    const shares = computeExpenseShares(e);
    const shareText = e.splitAmong.map(m=> `${m} ¥${Math.round(shares[m]||0)}`).join('、');
    return {
      '日期': e.date || '',
      '類別': `${c.emoji} ${c.label}`,
      '項目': e.desc,
      '金額(¥)': e.amount,
      '付款人': e.paidBy===POOL_KEY? '公帳（訂金支付）' : e.paidBy,
      '分攤家庭': e.splitAmong.join('、'),
      '各家分攤金額': shareText
    };
  });
  const totalRow = {'日期':'', '類別':'', '項目':'總計', '金額(¥)': splitData.expenses.reduce((s,e)=>s+e.amount,0), '付款人':'', '分攤家庭':'', '各家分攤金額':''};
  expenseRows.push(totalRow);

  const depositRowsX = splitData.members.map(m=>({'家庭': m, '人數': headOf(m), '已繳訂金(¥)': Number(splitData.deposits[m])||0}));
  depositRowsX.push({'家庭':'總計', '人數': splitData.members.reduce((s,m)=>s+headOf(m),0), '已繳訂金(¥)': splitData.members.reduce((s,m)=>s+(Number(splitData.deposits[m])||0),0)});

  const catTotalsX = computeCategoryTotals();
  const catRowsX = expenseCategories.map(c=>({'類別': `${c.emoji} ${c.label}`, '花費金額(¥)': catTotalsX[c.key]||0}));

  const balance = computeBalances();
  const balanceRows = splitData.members.map(m=>{
    const v = Math.round((balance[m]||0)*100)/100;
    return {
      '成員': m,
      '狀態': v>0.5? '多退' : (v<-0.5? '少補' : '剛好結清'),
      '金額(¥)': Math.abs(v)
    };
  });

  const settlements = computeSettlements(balance);
  const settleRows = settlements.length>0
    ? settlements.map(s=>({'付款人': s.from, '收款人': s.to, '金額(¥)': Math.round(s.amount)}))
    : [{'付款人':'-', '收款人':'-', '金額(¥)':'目前帳務已平衡，不需轉帳'}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(depositRowsX), '訂金');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expenseRows), '花費明細');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(catRowsX), '依類別統計');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(balanceRows), '結算總覽');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(settleRows), '建議轉帳');

  XLSX.writeFile(wb, '嗚啦啦廣州順德之旅_分帳紀錄.xlsx');
}

bindFlightInputs();
initFirebaseSync();
